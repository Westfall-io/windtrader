[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "sysml-windtrader"
version = "0.2.1"
description = "Python wrapper around windtrader-java for SysML v2 parse-only validation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Westfall-io" }]

dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8",
  "python-semantic-release>=10.0.0",
  "pre-commit>=3.7",
  "pytest-cov>=5.0",
  "coverage[toml]>=7.6",
  "interrogate>=1.7",
]

# -------------------------
# pytest
# -------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "jar: integration tests that invoke the real windtrader-java JAR (requires java on PATH)",
]

[tool.coverage.run]
branch = true
source = ["windtrader"]

[tool.coverage.report]
show_missing = true
skip_empty = true
omit = [
  "tests/*",
]

[tool.coverage.xml]
output = "coverage.xml"

[project.scripts]
windtrader = "windtrader.cli:main"

# Distribution name is sysml-windtrader (PyPI), but the import package remains
# windtrader — hatchling's default wheel heuristic matches project name to a
# directory, so pin the package explicitly (else the wheel build fails).
[tool.hatch.build.targets.wheel]
packages = ["src/windtrader"]

# -------------------------
# ruff (format + lint)
# -------------------------
[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

# -------------------------
# Python Semantic Release
# -------------------------
[tool.semantic_release]
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
changelog_file = "CHANGELOG.md"
assets = ["pyproject.toml", "CHANGELOG.md"]
commit_parser = "emoji"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
major_tags = ["💥", ":boom:"]
minor_tags = ["✨", ":sparkles:"]
patch_tags = ["🐛", "🚑", "🚑️", ":bug:", ":ambulance:"]
other_allowed_tags = [
  "📝", ":memo:",
  "✅", ":white_check_mark:",
  "🎨", ":art:",
  "🔧", ":wrench:",
  "📦", ":package:"
]
